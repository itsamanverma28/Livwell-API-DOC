<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LivWell Tech Docs</title>
<style>
:root{
  --bg:#ffffff;--fg:#1c1f26;--muted:#5b6270;--line:#e3e6ec;--card:#f6f7f9;
  --accent:#4f46e5;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --code:#eef0f4;--sidebar:#fafbfc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--fg:#e6e8ee;--muted:#9aa1b0;--line:#262a35;--card:#171a23;
    --accent:#8b86ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#1d212c;--sidebar:#12151d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--fg:#e6e8ee;--muted:#9aa1b0;--line:#262a35;--card:#171a23;
  --accent:#8b86ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--code:#1d212c;--sidebar:#12151d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font-size:16px;margin:0}
header .meta{color:var(--muted);font-size:12px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 53px)}
nav{border-right:1px solid var(--line);background:var(--sidebar);padding:14px 12px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px}
nav a.active,nav a:hover{background:var(--card);color:var(--accent)}
nav .group{margin:14px 10px 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
nav .count{float:right;color:var(--muted);font-size:12px}
main{padding:26px clamp(16px,4vw,46px);max-width:1120px;width:100%;min-width:0}
h2{font-size:24px;margin:0 0 6px}
h3{font-size:17px;margin:26px 0 8px}
.lead{color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .card{margin:0}
.card a{text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.wrap{word-break:break-word}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
code{background:var(--code);padding:1px 5px;border-radius:5px;word-break:break-all}
pre{background:var(--code);padding:12px 14px;border-radius:10px;overflow:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.GET{color:var(--ok)}.POST{color:var(--accent)}.PUT{color:var(--warn)}.DELETE{color:var(--bad)}
.mermaid{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;margin:8px 0}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--card);border-radius:6px;margin:10px 0;color:var(--fg)}
.flag{color:var(--warn);font-weight:600}
.sev-High{color:var(--bad);font-weight:700}.sev-Medium{color:var(--warn);font-weight:700}.sev-Low{color:var(--muted);font-weight:700}
input[type=search],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:14px 0 6px}
.muted{color:var(--muted)}
.files{font-size:13px;color:var(--muted)}
.spec{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.scroll{overflow-x:auto}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-block}
  nav{position:fixed;left:0;top:53px;width:270px;transform:translateX(-100%);transition:transform .2s;z-index:6;height:calc(100vh - 53px)}
  nav.open{transform:none}
  .filters{grid-template-columns:1fr}
  main{padding:20px 16px}
  header .meta{display:none}
}

tr.ep{cursor:pointer}
tr.ep:hover td{background:var(--card)}
tr.detail td{background:var(--card);padding:12px 14px}
.dsec{margin:0 0 12px}
.dsec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dsec table{margin:0;font-size:13px}
.curl{margin:0 0 6px;padding:10px 12px;background:var(--code-bg,#0f172a);color:var(--code-fg,#e2e8f0);border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre}
.copy{margin-left:8px;font-size:11px;padding:2px 8px;border:1px solid var(--line,#ccc);border-radius:6px;background:transparent;color:inherit;cursor:pointer;text-transform:none;letter-spacing:0}
.req{color:var(--warn);font-weight:700}

.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.sbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--bg)}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:10vh 12px 0;z-index:20}
#pal.open{display:flex}
#pal .box{width:min(680px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:var(--bg)}
#pal input:focus{outline:none}
#pal ul{list-style:none;margin:0;padding:6px;max-height:55vh;overflow:auto}
#pal li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#pal li.sel{background:var(--card)}
#pal li .t{font-weight:600;word-break:break-all}
#pal li .s{color:var(--muted);font-size:12px;display:block;font-weight:400}
#pal .hint{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.filters{grid-template-columns:2fr 1fr 1fr}
@media (max-width:820px){header{flex-wrap:wrap}header h1{font-size:15px}.sbtn{padding:6px 10px}.tabs button{padding:5px 8px}.sbtn kbd{display:none}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">Menu</button>
    <h1>LivWell Tech Docs</h1>
    <div class="tabs" id="tabs"><button data-site="backend">Backend</button><button data-site="corporate">Corporate</button></div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <div class="meta" id="meta"></div>
    <button class="sbtn" id="searchBtn" aria-label="Search">Search <kbd>Ctrl K</kbd></button>
  </div>
</header>
<div id="pal"><div class="box"><input id="palq" type="search" placeholder="Search endpoints, fields, modules, findings across both sites" autocomplete="off"><ul id="pall"></ul><div class="hint">Up and down to move, Enter to open, Esc to close. Search matches path, description, controller, auth and field names.</div></div></div>
<div class="layout">
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
<script>
const ALL = {"backend":{"modules":[{"id":"auth","title":"Auth & Sessions","group":"Foundations","summary":"How protected routes check the API key, JWT and session, plus MFA (two-factor) routes.","files":["src/plugins/authToken.ts","mfaRoute.ts"],"flows":[{"title":"Session validation (every protected request)","code":"sequenceDiagram\n  autonumber\n  participant C as Client app\n  participant H as Hapi route\n  participant S as Auth strategy\n  participant R as Redis\n  participant M as MongoDB (loginHistory / users)\n  C->>H: Request + header api_key + Authorization Bearer\n  H->>S: validate(accessToken)\n  S->>S: api_key equals SERVER.API_KEY_V2?\n  alt api_key invalid\n    S-->>C: rejected\n  end\n  S->>S: decodeToken + isTimeExpired\n  alt access token expired\n    S-->>C: SESSION_EXPIRED (session kept for refresh)\n  end\n  S->>R: GET userId.deviceId (if IS_REDIS_ENABLE)\n  alt cache miss\n    S->>M: findUserById + loginHistory findDeviceById\n  end\n  alt session row missing\n    S-->>C: SESSION_EXPIRED\n  else user blocked\n    S->>M: removeSession(userId, true)\n    S-->>C: BLOCKED\n  else valid\n    S-->>H: credentials (tokenData built)\n    H-->>C: 200 response\n  end","note":"Generic path. Strategy-specific rules are below."},{"title":"Two-factor (MFA) routes","code":"flowchart LR\n  A[\"POST /v1/twofactorcode/secret or /v1/tfa/setup\"] --> B[\"POST /v1/tfa/validate (QR URL)\"]\n  B --> C[\"POST /v1/twofactorcode/send\"]\n  C --> D[\"POST /v1/twofactorcode/validate\"]\n  D --> E[\"PUT /v1/tfa/disable\"]\n  F[\"POST /v1/totp-secret, totp-generate, totp-validate (controller not detected)\"]","note":"The totp-* routes have no controller detected in config; check their handlers."}],"strategiesTable":true,"rules":["Declared strategies in routes: UserAuth, AdminAuth, CorporateAdminAuth, CorporateAuth, CommonAuth, BasicAuth, PublicBasicAuth, MFA_Auth, UserRefreshAuth, DiabAuth (vendor-auth), ClevertapAuth (webhook). DoubleAuth is defined in authToken.ts but no route uses it.","UserAuth: an expired access token returns SESSION_EXPIRED and keeps the session, so refresh can still happen.","UserAuth: a refresh token used as an access token removes the session and returns ACCESS_DINED.","A blocked user triggers removeSession(tokenData, true) and returns BLOCKED.","UserRefreshAuth: an expired refresh token removes the session.","8 removeSession calls are commented out in authToken.ts, including on expired and missing-session paths.","Query-string tokens are disabled in every strategy (allowQueryToken false)."]},{"id":"users","title":"Users & Login","group":"Foundations","summary":"User login and sign-up, OTP delivery, token refresh and logout, email verification, device tokens, insights handoff, and user exports.","files":["userRoute.ts"],"flows":[{"title":"Login, tokens and logout","code":"flowchart LR\n  A[\"POST /v3/user/send-otp (BasicAuth)\"] --> B[\"POST /v3/user/login (BasicAuth): login or sign-up\"]\n  B --> C[\"Tokens issued to the app\"]\n  C --> D[\"POST /v1/user/refresh/token (UserRefreshAuth) when access token expires\"]\n  C --> E[\"POST /v1/user/logout (UserAuth)\"]\n  C --> F[\"PUT /v1/user/device/token (UserAuth): push token\"]\n  G[\"Email verification: POST /v1/user/send-email-otp, then /v1/user/verify-email-otp (UserAuth)\"]","note":"Login is /v3/user/login. The route description says 'User Login/Signup'."},{"title":"Insights handoff and exports","code":"flowchart LR\n  A[\"Profile and health: GET /v1/user/healthStats\"] --> B[\"Insights: GET /v1/user/insights-url, POST /v1/user/insight-session\"]\n  C[\"Insights app calls GET /v1/user/validate-insights-session (BasicAuth)\"] --> B\n  D[\"Admin exports: GET /v1/user/export, /v1/user/lwc-distribution/export (no declared auth)\"]","note":"Route-derived. Confirm the insights session handshake in the controller."}],"rules":["GET /v1/user/export and /v1/user/lwc-distribution/export declare no auth strategy. Exports can contain personal data, so verify or add a strategy.","GET /v1/avatar/list is UserAuth but its description reads 'Burnt Sessions'. Fix the description or confirm the route."]},{"id":"corporate","title":"Corporate","group":"Corporate","summary":"Corporate accounts, employees, departments, company coupons, account linking and employee email verification.","files":["corporateRoute.ts"],"flows":[{"title":"Corporate admin and employee journey","code":"flowchart LR\n  A[\"Corporate login: POST /v1/corporate/login (BasicAuth)\"] --> B[\"GET /v1/corporate/info\"]\n  B --> C[\"Employees: POST and GET /v2/corporate/employees, PUT and DELETE /v1/corporate/employee\"]\n  B --> D[\"Departments: GET /v1/corporate/departments, steps, challenge progress\"]\n  E[\"Employee links account: POST /v2/corporate/link-employee (UserAuth)\"] --> F[\"GET /v1/corporate/companyCoupon-details\"]\n  E --> G[\"Email OTP: POST /v1/corporate/send-email-otp, verify-email-otp (UserAuth)\"]\n  H[\"Admin: POST /v1/corporate and PUT /v1/corporate (no declared auth)\"]","note":"Route-derived. The email verification routes here match the corporate flow documented in the corporate repo."}],"rules":["POST /v1/corporate (Add Corporate) and PUT /v1/corporate (Edit Corporate) declare no auth strategy. High priority to verify.","POST /v1/corporate/login uses BasicAuth; the rest of the corporate routes use CorporateAuth, CorporateAdminAuth or UserAuth."]},{"id":"challenges","title":"Challenges","group":"Engagement","summary":"Challenge scheduling, start and progress, history and leaderboards, plus user activity logging and spin-wheel events.","files":["challengeRoute.ts","activityRoute.ts","spinwheelRoute.ts"],"flows":[{"title":"Challenge journey","code":"flowchart LR\n  A[\"Schedule: GET /v1/challenge/schedule (v2 and v4 also exist)\"] --> B[\"POST /v1/challenge/start\"]\n  B --> C[\"GET /v1/challenge/tracking\"]\n  C --> D[\"POST /v1/challenge/progress (after expiry)\"]\n  C --> E[\"PUT /v1/challenge/cancel\"]\n  D --> F[\"GET /v1/challenge/history (v1, v2, v3)\"]\n  F --> G[\"History details and leaderboard\"]\n  H[\"Admin: add, update, block, participants, exports (exports have no declared auth)\"] --> A","note":"Route-derived. Several versions (v1 to v4) exist; confirm which the app calls."}],"rules":["Challenge export routes (export, participants/export, un-participants/export) declare no auth strategy.","POST /v1/clevertap/spinwheel/events uses ClevertapAuth (webhook auth)."]},{"id":"badges","title":"Badges & Banners","group":"Engagement","summary":"Badges earned through challenges, the trophy board and history, and promotional banners.","files":["badgeRoute.ts","bannerRoute.ts"],"flows":[{"title":"Badge journey","code":"flowchart LR\n  A[\"Admin: POST and PUT /v1/badge\"] --> B[\"GET /v1/badge/schedule\"]\n  B --> C[\"Challenge earns badge\"]\n  C --> D[\"GET /v1/badge/board (trophy corner)\"]\n  C --> E[\"GET /v1/badge/history (won)\"]\n  F[\"Banners: POST, GET, DELETE /v1/banner\"]","note":"Route-derived."}],"rules":[]},{"id":"habits","title":"Habits & Nutrition","group":"Engagement","summary":"Habit goals, plans, daily logs, reminders and notes, plus meal and weight logging (v1 to v3 routes).","files":["userHabitRoute.ts","userHabitHistoryRoute.ts","userHabitPlanRoute.ts","userHabitLogRoute.ts","habitGoalRoute.ts","mealLogRoute.ts","weightLogRoute.ts"],"flows":[{"title":"Habit plan and daily logging","code":"flowchart LR\n  A[\"GET /v3/habit-goals: 5 goal pillars with AI flags\"] --> B[\"GET /v3/habit-goals/activities for one goal\"]\n  B --> C[\"POST /v3/user/habit-plan: create plan\"]\n  C --> D[\"PUT /v3/user/habit-plan/activities (add) and /remove\"]\n  D --> E[\"GET /v3/user/habits/home: today, week strip, streaks\"]\n  E --> F[\"PUT /v3/user/habits/logs: log 1-20 activities\"]\n  F --> G[\"GET /v3/user/habits/activity: calendar\"]\n  H[\"Meals and weight: /v3/user/meal-log, /v3/user/weight-log\"]","note":"Built from the route descriptions, which are detailed for v3. Confirm the rules in the habit service."}],"rules":["The v1 and v2 habit routes and the v3 routes coexist. Decide which set the app uses and mark the other as deprecated."]},{"id":"health","title":"Health & Face Scan","group":"Engagement","summary":"Device health data sync (v4 to v6), vitals and activity reads, Garmin connection and sync, and face-scan health scores.","files":["healthRoute.ts","faceScanRoute.ts","userHealthStatsRoute.ts"],"flows":[{"title":"Health sync and Garmin connection","code":"flowchart LR\n  A[\"Device sync: POST /v4, /v5, /v6 /health/syncing (UserAuth)\"] --> B[\"GET /v1/health/vitals, activity, score, stepsActivity\"]\n  C[\"GET /v1/health/garmin/oauth (UserAuth): authorization URL\"] --> D[\"User authorizes at Garmin\"]\n  D --> E[\"GET /v1/health/garmin/oauth/verified (callback, no declared auth)\"]\n  E --> F[\"POST /v1/health/garmin/oauth/verify (UserAuth): store token\"]\n  F --> G[\"POST /v1/health/garmin/syncing (no declared auth)\"]\n  G --> H[\"GET /v1/health/garmin/challenge/progress\"]\n  I[\"POST /v1/health/garmin/delinked (no declared auth)\"]","note":"Route-derived with the Garmin steps in order. Confirm the callback and token handling in the controller."}],"rules":["POST /v1/health/garmin/syncing and POST /v1/health/garmin/delinked declare no auth strategy. Delinking or pushing data without a verified caller is a high-priority check.","GET /v1/health/garmin/oauth/verified is a browser callback and declares no strategy. Confirm it validates the OAuth state."]},{"id":"referrals","title":"Referrals","group":"Commerce","summary":"Referral code programme: creating, listing and editing codes, and reports and exports.","files":["referralProgramRoute.ts"],"flows":[{"title":"Referral code lifecycle","code":"flowchart LR\n  A[\"Admin creates codes: POST /v1/referral-program\"] --> B[\"GET /v1/referral-program (list)\"]\n  B --> C[\"PUT /v1/referral-program (edit)\"]\n  D[\"Exports: /v1/referral-program/export, /v1/referrer/export, /v1/membership/report (no declared auth)\"]","note":"Route-derived."}],"rules":["The export and report routes (export, referrer/export, membership/report) declare no auth strategy."]},{"id":"rewards","title":"Rewards & Gifts","group":"Commerce","summary":"Reward catalogue, bidding, redemption, QR check-in, gifts and gift cart, Monopoly rewards, LWC credit and discount codes.","files":["rewardRoute.ts","monopolyRewardRoute.ts","giftRoute.ts","discountCodeRoute.ts","lwcCreditManagementRoute.ts"],"flows":[{"title":"Reward, gift and voucher journey","code":"flowchart LR\n  A[\"Reward schedule: GET /v1/reward/schedule, /v3/reward/schedule\"] --> B[\"Bid: /v1/reward/bid/* then POST /v1/reward/place/bids\"]\n  B --> C[\"POST /v1/reward/bid/claim\"]\n  A --> D[\"POST /v1/reward/redeem\"]\n  D --> E[\"GET /v1/reward/history\"]\n  A --> F[\"Check-in by QR: POST /v1/reward/check-in\"]\n  G[\"Gifts: GET /v1/gift/schedule, cart, POST /v1/gift/pay (UserAuth)\"] --> H[\"GET /v1/gift/cart-status\"]\n  I[\"Monopoly rewards and discount codes: admin CRUD\"]","note":"Route-derived."}],"rules":["Reward export and redeem export routes declare no auth strategy.","GET /v1/gift/multiplier uses PublicBasicAuth. Confirm it should be public."]},{"id":"payments","title":"Payments","group":"Commerce","summary":"Payment initiation, status checks and the payment provider (BoaKim) order, webhook and status pages.","files":["paymentRoute.ts"],"flows":[{"title":"Payment order and provider callback","code":"flowchart LR\n  A[\"POST /v3/baokim/send/order (UserAuth): generate payment URL\"] --> B[\"User pays at the payment provider\"]\n  B --> C[\"Provider webhook: POST /v3/baokim/payment/info (no declared auth)\"]\n  B --> D[\"Status page: GET /v3/baokim/payment/status (no declared auth)\"]\n  A --> E[\"GET /v1/payments/status-check (UserAuth)\"]\n  F[\"Legacy path: POST /v1/payment/initiate, GET /v2/payment/complete (UserAuth)\"]","note":"Route-derived. Check the webhook verifies the provider's signature."}],"rules":["POST /v3/baokim/payment/info (provider webhook) declares no auth strategy. Confirm the handler verifies the provider signature before it changes any order.","Both BoaKim status pages are unauthenticated GET routes. Confirm they expose no sensitive order data."]},{"id":"partners","title":"Partners & Integrations","group":"Partners","summary":"Third-party integrations: DiaB (diabetes care), CFYC, Permate, Urbox, Sunlife and insurance leads, and the Calii route.","files":["diabRoute.ts","caliRoute.ts","permateRoute.ts","urboxRoute.ts","leadsRoute.ts"],"flows":[{"title":"Partner integrations","code":"flowchart LR\n  A[\"DiaB: GET /v1/diab/token-info (UserAuth)\"] --> B[\"POST /v1/diab/doctor-recommendations\"]\n  C[\"DiaB vendor callbacks: PUT /v1/diab/appointment/status (DiabAuth)\"] --> D[\"Consultation status and link\"]\n  E[\"CFYC: POST /v1/cfyc/user-activity (no declared auth)\"]\n  F[\"Permate: POST /v1/permate/userDetails, /policyPurchased\"]\n  G[\"Urbox: PUT and GET /v1/urbox (admin)\"]\n  H[\"Leads: GET /v1/leads/interests, POST /v1/sunlife/leads, GET /v1/leads/export (no declared auth)\"]","note":"Route-derived. DiaB callbacks use the vendor strategy."}],"rules":["POST /v1/cfyc/user-activity declares no auth strategy. Confirm it validates the partner's credentials.","GET /v1/leads/export declares no auth strategy and exports lead data."]},{"id":"notifications","title":"Notifications & SMS","group":"Engagement","summary":"In-app notifications and SMS and Zalo OTP delivery, including the delivery-status callbacks.","files":["notificationRoute.ts","smsRoute.ts"],"flows":[{"title":"Notification and SMS flow","code":"flowchart LR\n  A[\"Push or in-app event\"] --> B[\"GET /v1/notification (list)\"]\n  B --> C[\"PUT /v1/notification (mark read)\"]\n  C --> D[\"DELETE /v1/notification (clear)\"]\n  E[\"SMS: POST /v1/sms (no declared auth)\"] --> F[\"OTP status callbacks: /v1/sms/otp/status, /v1/zalo/otp/status (no declared auth)\"]","note":"Route-derived."}],"rules":["POST /v1/sms decl serId"],["user_habit_set","users","userId"],["user_habit_streaks","user_habit_plans","planId"],["user_habit_streaks","users","userId"],["user_habits","users","userId"],["user_health_stats","users","userId"],["user_vitals_histories","users","userId"],["users","corporates","corporateId"],["vitals","users","userId"],["weight_logs","users","userId"]],"unmappedControllers":["faceScanControllerV3","habitActivityControllerV1","insuranceControllerV1"]}}},"corporate":{"modules":[{"id":"auth","title":"Auth & Sessions","group":"Foundations","summary":"How every protected route checks the API key, the JWT, and the session. Also covers MFA (two-factor) and OTPless magic links.","files":["src/plugins/authToken.ts","src/lib/tokenManager.ts","mfaRoute.ts","otplessRoute.ts"],"flows":[{"title":"Session validation (every protected request)","code":"sequenceDiagram\n  autonumber\n  participant C as Client app\n  participant H as Hapi route\n  participant S as Auth strategy\n  participant R as Redis\n  participant M as MongoDB (loginHistory / users)\n  C->>H: Request + header api_key + Authorization Bearer\n  H->>S: validate(accessToken)\n  S->>S: api_key matches SERVER.API_KEY or API_KEY_V2?\n  alt api_key invalid\n    S-->>C: rejected\n  end\n  S->>S: decodeToken + isTimeExpired\n  alt access token expired\n    S-->>C: SESSION_EXPIRED (session kept for refresh)\n  end\n  S->>R: GET userId.deviceId (if IS_REDIS_ENABLE)\n  alt cache miss\n    S->>M: findUserById + loginHistory findDeviceById\n  end\n  alt session row missing\n    S-->>C: SESSION_EXPIRED / SESSION_TERMINATED\n  else user blocked\n    S->>M: removeSession(userId, true)\n    S-->>C: BLOCKED\n  else valid\n    S-->>H: credentials (tokenData built)\n    H-->>C: 200 response\n  end","note":"Shown for the generic path. Strategy-specific rules are in the table below."},{"title":"Two-factor (MFA) routes","code":"flowchart LR\n  A[\"POST /v1/twofactorcode/secret or /v1/tfa/setup\"] --> B[\"POST /v1/tfa/validate (QR URL)\"]\n  B --> C[\"POST /v1/twofactorcode/send\"]\n  C --> D[\"POST /v1/twofactorcode/validate\"]\n  D --> E[\"PUT /v1/tfa/disable\"]\n  F[\"POST /v1/totp-secret, totp-generate, totp-validate (controller not detected)\"]","note":"Route names suggest the order. The totp-* routes have no controller detected in config; check their handlers."}],"strategiesTable":true,"rules":["Every strategy rejects query-string tokens (allowQueryToken false). Keep it that way.","An expired access token alone returns SESSION_EXPIRED and keeps the session, so a refresh can still happen.","A refresh token used as an access token removes the session and returns ACCESS_DINED.","A user or corporate account that is blocked triggers removeSession(tokenData, true) and returns BLOCKED.","Redis key is {userId}.{deviceId}, used only when IS_REDIS_ENABLE is on. Single-device login is controlled by IS_SINGLE_DEVICE_LOGIN.","Token lifetimes in tokenManager.ts: 10 min and 3 min tokens signed with JWT_CERT_KEY; a 100 min token and the login/refresh token (LOGIN_TOKEN_EXPIRATION_TIME, about 180 days per comment) signed with per-user salt. Map each case to its signing key before publishing."]},{"id":"corporate","title":"Corporate","group":"Corporate","summary":"Corporate accounts, admin users, employees, departments, company coupons, OTP login, and the email verification that links an employee to a corporate.","files":["corporateRoute.ts","assessmentRoute.ts"],"flows":[{"title":"Email verification: setup and login","code":"sequenceDiagram\n  autonumber\n  participant HR as HR (portal)\n  participant B as Backend (loginV3)\n  participant DB as MongoDB\n  participant R as Redis\n  participant U as New or existing employee\n  HR->>DB: Mass upload (email empty, linkedVia CORPORATE)\n  DB->>DB: employee.isCorporateLinked = false\n  U->>B: loginV3 (mobile OTP)\n  alt Case 1: no existing LivWell user\n    B->>DB: isUserAvailableAtAnyCorporate (mobile match)\n  else Case 2: existing user already signed in\n    B->>DB: upsert employee\n    B->>R: removeSession(userId, true)\n    U-->>U: next call returns 401, must log in again\n    U->>B: loginV3 again\n  end\n  B-->>U: 200 with isCorporateVerificationPending true and corporateInfo\n  U->>U: Corporate Email screen (nationalId optional)","note":"From the attached diagrams. Not every step was matched to code in this pass."},{"title":"Email verification: send OTP","code":"flowchart TD\n  A[\"POST /send-email-otp corporateEmail\"] --> B{\"Resolve corporate: companyCoupon, then corporateId, then mobile\"}\n  B --> C{\"corporate.isEmailRequired?\"}\n  C -- FALSE --> E[\"Send OTP\"]\n  C -- TRUE --> D{\"Email domain in corporate.domains?\"}\n  D -- NO --> F[\"4xx INVALID_CORPORATE_EMAIL_DOMAIN\"]\n  D -- YES --> E\n  E --> G[\"Redis OTP under CORPORATE_EMAIL_VERIFY__userId and under email\"]","note":"Domain check runs only when isEmailRequired is true."},{"title":"Email verification: state machine","code":"stateDiagram-v2\n  [*] --> Uploaded: HR upload (email empty)\n  Uploaded --> SessionRevoked: Case 2 existing user\n  SessionRevoked --> ReLogin: 401 forced\n  Uploaded --> Onboarding: Case 1\n  ReLogin --> LoginV3\n  Onboarding --> LoginV3\n  LoginV3 --> EmailPending: isCorporateVerificationPending = true\n  LoginV3 --> Normal: no pending link\n  EmailPending --> OTPSent: OTP sent\n  EmailPending --> OTPRejected: domain invalid and isEmailRequired\n  OTPRejected --> EmailPending: retry\n  OTPSent --> EmailVerified: verify-email-otp ok\n  EmailVerified --> Normal: users, employees and Redis updated\n  Normal --> [*]","note":"Covers Case 1 (new employee) and Case 2 (existing user forced to log in again)."}],"rules":["Known gap: after verification, the second login should go straight to the dashboard once isCorporateVerificationPending is false. Confirm the pending query matches only unlinked employees.","Mass upload of an existing user signs them out (removeSession with true). Confirm this is intended.","The auth and dashboard flows for corporate admins use CorporateAdminAuth; corporate employees use CorporateAuth or UserAuth depending on the route."]},{"id":"wellness","title":"Corporate Wellness","group":"Corporate","summary":"Wellness benefit requests raised by a corporate, and the admin workflow that moves them through PENDING, PROCESSING, ARRANGED, ACTIVE.","files":["corporateWellnessRoute.ts"],"flows":[{"title":"Benefit request lifecycle","code":"flowchart LR\n  A[\"Corporate: POST /v1/corporate/wellness/requests\"] --> B[\"PENDING\"]\n  B --> C[\"Corporate edit: PUT requests or requests/participants\"]\n  B --> D[\"Corporate cancel: PUT requests/cancel (PENDING or PROCESSING)\"]\n  B --> E[\"Admin: PUT admin/wellness/requests/status\"]\n  E --> F[\"PROCESSING, then ARRANGED, then ACTIVE\"]\n  E --> G[\"Admin force cancel at any stage\"]","note":"Status path is taken from the route description. Confirm allowed transitions in the service code."}],"rules":["None of the wellness routes declare an auth strategy in config. Verify the handler checks the caller before release."]},{"id":"wogi","title":"WOGI Vouchers","group":"Commerce","summary":"Corporate bulk purchase of WOGI vouchers, the async callback from WOGI, and the admin tools for catalog sync, webhooks, signals, balance, and reconciliation.","files":["wogiRoute.ts","wogi_doc/doc.yaml"],"flows":[{"title":"Voucher purchase end to end","code":"sequenceDiagram\n  autonumber\n  participant Adm as Admin\n  participant Corp as Corporate user\n  participant API as LivWell API\n  participant Q as RabbitMQ\n  participant W as WOGI Connect\n  Adm->>API: POST admin/wogi/sync-catalog\n  Adm->>API: POST admin/wogi/webhooks (register callback URL)\n  Corp->>API: POST corporate/login\n  Corp->>API: GET wogi/categories, brands, products\n  Corp->>API: POST corporate/wogi/purchase\n  API->>API: Check quota and reward ID, reserve quota atomically\n  API->>API: Create batch and wogi_orders (PENDING)\n  API->>Q: Publish issue jobs (rate limit 5 req/s)\n  Q->>W: Issue voucher\n  W->>API: POST wogi/order/status (header wogi-auth-token)\n  API-->>W: 200 ok (under 10s)\n  API->>Q: Enqueue fetch PIN or URL, add to inventory\n  Adm->>API: GET admin/wogi/balance, POST reconcile-pending","note":"Matches the WOGI section of wogi_doc/doc.yaml."}],"rules":["The WOGI callback (/v1/wogi/order/status) declares no strategy. It relies on the wogi-auth-token header; check the handler verifies it.","Most /v1/admin/wogi/* routes declare no auth strategy in config, even though doc.yaml says Admin Bearer JWT. Verify each handler.","Purchase is rate limited to 5 requests per second per the spec."]},{"id":"rewards","title":"Rewards","group":"Commerce","summary":"Reward catalogue, bidding, redemption, QR check-in at clubs, promo and coupon codes, and reward history.","files":["rewardRoute.ts"],"flows":[{"title":"Reward journey (bid, redeem, check-in)","code":"flowchart LR\n  A[\"Browse schedule: /v1/reward/schedule, /v3/reward/schedule\"] --> B{\"Reward type\"}\n  B -- Bid --> C[\"bid/schedule, then place/bids, then bid/leaderboard, then bid/claim\"]\n  B -- Redeem --> D[\"POST /v1/reward/redeem\"]\n  D --> E[\"GET /v1/reward/history\"]\n  A --> F[\"Check-in by QR: POST /v1/reward/check-in\"]\n  F --> G[\"check-in/club: GET and PUT\"]\n  H[\"Admin: create, update, block, dealsOfTheDay, assign coupon codes\"] --> A","note":"Route-derived. Confirm the transitions in the reward controller."}],"rules":["Export endpoints (/v1/reward/export, /redeem/export) declare no auth strategy in config. Verify."]},{"id":"challenges","title":"Challenges","group":"Engagement","summary":"Step challenges for users and corporates: scheduling, starting, progress tracking, history, leaderboards, and admin management with exports.","files":["challengeRoute.ts"],"flows":[{"title":"Challenge journey","code":"flowchart LR\n  A[\"Schedule: GET /v1/challenge/schedule (v2, v4 also exist)\"] --> B[\"POST /v1/challenge/start\"]\n  B --> C[\"GET /v1/challenge/tracking\"]\n  C --> D[\ function authBadge(a){

function fieldTable(title, rows){
  if (!rows || !rows.length) return "";
  return `<div class="dsec"><h4>${esc(title)}</h4><div class="scroll"><table>
    <thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Details</th></tr></thead>

  </table></div></div>`;
}

function sampleVal(f){
  const d = f.details || "";
  let m = d.match(/one of ([^;]+)/);
  if (m) { const first = m[1].split(",")[0].replace(/\(.*$/,"").trim().replace(/^['"]|['"]$/g,""); if (f.type === "number") { const n = Number(first); return isNaN(n) ? 0 : n; } return first; }
  m = d.match(/default ([^;,]+)/);
  if (m) { const v = m[1].trim().replace(/^['"]|['"]$/g,""); if (f.type === "number") { const n = Number(v); if (!isNaN(n)) return n; } else if (f.type === "boolean") return v === "true"; else return v; }
  if (f.type === "number") return 0;
  if (f.type === "boolean") return true;
  if (f.type === "array") return [];
  if (f.type === "object") return {};
  return "string";
}
function buildBody(rows){
  const root = {};
  (rows || []).forEach(f => {
    if (f.name === "(body)" || f.name === "...") return;
    const parts = f.name.replace(/\[\]/g, "").split(".");
    let o = root;
    for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== "object" || o[parts[i]] === null || Array.isArray(o[parts[i]])) o[parts[i]] = {}; o = o[parts[i]]; }
    const last = parts[parts.length - 1];
    if (f.type === "object") { if (!(last in o)) o[last] = {}; } else o[last] = sampleVal(f);
  });
  return root;
}
function shq(s){ return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
function tokenVar(a){
  if (/Corporate/.test(a)) return "CORPORATE_AUTH_TOKEN";
  if (/Admin|MFA/.test(a)) return "ADMIN_AUTH_TOKEN";
  if (/User/.test(a)) return "USER_AUTH_TOKEN";
  return "AUTH_TOKEN";
}
function curlFor(r){
  const q = r.req || {};
  const noAuth = r.auth === "Not declared" || r.auth.startsWith("none");
  let url = "${BASE_URL}" + r.fullPath.replace("{API_BASE_URL}", "");
  const qs = (q.query || []).filter(f => f.required && !f.name.includes(".")).map(f => encodeURIComponent(f.name) + "=" + encodeURIComponent(sampleVal(f)));
  if (qs.length) url += "?" + qs.join("&");
  const lines = ["curl --location --request " + r.method + " '" + url.replace(/'/g, "%27") + "'"];
  if (!noAuth) lines.push("--header 'Authorization: ${" + tokenVar(r.auth) + "}'");
  lines.push("--header 'api_key: ${API_KEY}'");
  const hs = (q.headers && q.headers.length) ? q.headers : [{name:"platform",required:true},{name:"timezone",required:true},{name:"language",required:true}];
  hs.forEach(h => {
    if (!h.required || h.name === "authorization") return;
    lines.push("--header " + shq(h.name + ": " + (h.name === "platform" ? "3" : h.name === "language" ? "en" : h.name === "timezone" ? "0" : sampleVal(h))));
  });
  const body = buildBody(q.payload);
  if (q.payload && q.payload.length) {
    lines.push("--header 'Content-Type: application/json'");
    lines.push("--data-raw " + shq(JSON.stringify(body, null, 4)));
  }
  return lines.join(" \\\n");
}
function curlBlock(r){
  const c = curlFor(r);
  return `<div class="dsec"><h4>cURL example <button class="copy" data-copy>Copy</button></h4><pre class="curl">${esc(c)}</pre><span class="muted">Set BASE_URL, API_KEY${SITE === 'backend' ? ' (the backend expects the API_KEY_V2 value)' : ''} and the token variable in your shell. Sample values come from defaults and allowed values; replace them. All fields from the validation are included, optional ones too; remove the ones you don't need. Values written like NAME.VALUE are constants from the code; use the real value.</span></div>`;
}
function copyText(btn, text){
  const old = btn.textContent;
  try { navigator.clipboard.writeText(text); btn.textContent = "Copied"; } catch (x) { btn.textContent = "Copy failed"; }
  setTimeout(() => btn.textContent = old, 1500);
}
function epHash(r){ return `#${SITE}/${r.module}/ep/${encodeURIComponent(r.method + " " + r.path)}`; }
function reqDetail(r){
  const q = r.req || {};
  let html = `<div class="dsec"><button class="copy" data-link style="margin-left:0">Copy link to this endpoint</button></div>`;
  if (q.headers && q.headers.length) html += fieldTable("Headers (" + (q.headersRef || "") + ") plus api_key", q.headers);
  else if (q.headersRef) html += `<div class="dsec"><h4>Headers</h4><span class="muted">Declared as ${esc(q.headersRef)}</span></div>`;
  html += fieldTable("Query parameters", q.query);

  if (!(q.query && q.query.length) && !(q.payload && q.payload.length)) html += `<div class="dsec"><span class="muted">No query or body fields declared in the route validation.</span></div>`;
  html += curlBlock(r);
  if (q.notes) html += `<div class="dsec"><h4>Notes</h4><span>${esc(q.notes)}</span></div>`;
  html += `<div class="dsec"><span class="muted">Source file: ${esc(r.file)}.ts, controller ${esc(r.controller)}. Responses are not declared in the route config.</span></div>`;
  return html;
}

function wireTable(routes, m, ep){
  const q = document.getElementById("q");
  const sel = document.getElementById("m");
  const asel = document.getElementById("a");
  const rows = document.getElementById("rows");
  const count = document.getElementById("rcount");
  function paint(){
    const term = q.value.trim().toLowerCase();
    const meth = sel.value, au = asel.value;
    const list = routes.filter(r =>
      (!meth || r.method === meth) && (!au || r.auth === au) &&
      (!term || (r.fullPath + " " + r.description + " " + r.controller).toLowerCase().includes(term)));
    rows.innerHTML = endpointRows(list) || `<tr><td colspan="5" class="muted">No endpoints match.</td></tr>`;
    count.textContent = `${list.length} of ${routes.length} shown`;
  }
  function open(tr, scroll){
    const r = D.routes[+tr.dataset.i];
    const d = document.createElement("tr");
    d.className = "detail";
    d.innerHTML = `<td colspan="5">${reqDetail(r)}</td>`;
    const cb = d.querySelector("[data-copy]");
    if (cb) cb.addEventListener("click", e => { e.stopPropagation(); copyText(cb, d.querySelector("pre.curl").textContent); });
    const lb = d.querySelector("[data-link]");
    if (lb) lb.addEventListener("click", e => { e.stopPropagation(); copyText(lb, location.origin + location.pathname + epHash(r)); });
    tr.after(d);
    try { history.replaceState(null, "", epHash(r)); } catch (x) {}
    if (scroll) tr.scrollIntoView({ block: "start" });
  }
  rows.addEventListener("click", e => {
    const tr = e.target.closest("tr.ep");
    if (!tr) return;
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("detail")) {
      next.remove();
      try { history.replaceState(null, "", `#${SITE}/${m.id}`); } catch (x) {}
      return;
    }
    open(tr, false);
  });
  q.addEventListener("input", paint);
  sel.addEventListener("change", paint);
  asel.addEventListener("change", paint);
  paint();
  if (ep) {
    const sp = ep.indexOf(" ");
    const meth = ep.slice(0, sp), path = ep.slice(sp + 1);
    const r = routes.find(x => x.method === meth && x.path === path);
    if (r) { const tr = rows.querySelector(`tr.ep[data-i="${D.routes.indexOf(r)}"]`); if (tr) open(tr, true); }
  }
}

const accWord = a => a.includes("w") ? (a.includes("r") ? "read and write" : "write") : "read";

const DEP_NOTE = `<p class="muted" style="font-size:12px">Derived by reading the source: which controllers call which, which DAOs they use and the collection names those DAOs pass to the base DAO, and the <code>ref</code> fields in the Mongoose models. It does not see calls built at run time, Mongoose hooks or events. "read" and "write" are guessed from the method name.</p>`;

  return `<h3>Relationships and dependencies</h3>
    ${X.graph ? `<div class="mermaid">${esc(X.graph)}</div><p class="muted" style="font-size:13px;margin:0">Arrows run from the caller to the callee, labelled with the number of calls found. Dotted lines are infrastructure and third parties.</p>` : ""}
    ${dep}${used}

function show(raw){
  const parts = (raw || "").split("/");
  if (ALL[parts[0]]) { const site = parts.shift(); if (site !== SITE) setSite(site); }
  const key = parts[0] || "overview";
  const ep = parts[1] === "ep" && parts[2] ? decodeURIComponent(parts[2]) : null;
  let html, routes = null, mod = null;
  if (key === "overview") html = viewOverview();
  else if (key === "findings") html = viewFindings();
  else if (key === "dependencies" && D.deps) html = viewDependencies();
  else if (key === "datamodel" && D.deps) html = viewDataModel();
  else {
    mod = D.modules.find(x => x.id === key);
    if (!mod) { return show(SITE + "/overview"); }
    html = viewModule(mod);
    routes = D.routes.filter(r => r.module === mod.id);
  }
  main.innerHTML = html;
  if (routes) wireTable(routes, mod, ep);
  const dq = document.getElementById("dq");
  if (dq) dq.addEventListener("input", () => { const t = dq.value.trim().toLowerCase(); document.querySelectorAll("#drows tr").forEach(tr => tr.style.display = (!t || tr.dataset.t.includes(t)) ? "" : "none"); });
  renderDiagrams(main);
  document.querySelectorAll("nav a[data-go]").forEach(a => a.classList.toggle("active", a.dataset.go === key));
  document.getElementById("nav").classList.remove("open");
  if (!ep) window.scrollTo(0, 0);
}

// ----- search palette (Ctrl/Cmd K) -----
const SIDX = [];
function fieldNames(list, out){ (list || []).forEach(f => out.push(f.name)); return out; }
Object.keys(ALL).forEach(site => {
  const d = ALL[site];
  d.modules.forEach(m => SIDX.push({ site, kind: "module", title: m.title, sub: m.summary,
    text: (m.title + " " + m.summary + " " + (m.rules || []).join(" ")).toLowerCase(), hash: `#${site}/${m.id}` }));
  d.routes.forEach(r => {
    const q = r.req || {};
    const names = fieldNames(q.payload, fieldNames(q.query, [])).join(" ");
    SIDX.push({ site, kind: "endpoint", method: r.method, title: r.path, sub: (r.description || "") + " | " + r.controller,
      text: (r.method + " " + r.path + " " + r.description + " " + r.controller + " " + r.auth + " " + names).toLowerCase(),
      hash: `#${site}/${r.module}/ep/${encodeURIComponent(r.method + " " + r.path)}` });
  });
  if (d.deps) {
    SIDX.push({ site, kind: "page", title: "Dependencies", sub: "How modules depend on each other", text: "dependencies relationships calls cycle layers jobs cron", hash: `#${site}/dependencies` });
    d.deps.global.collections.forEach(c => SIDX.push({ site, kind: "collection", title: c.collection, sub: "Collection | main writer: " + (c.owner || "none") + " | used by " + Object.keys(c.modules).join(", "),
      text: (c.collection + " collection " + Object.keys(c.modules).join(" ") + " " + c.refsTo.join(" ") + " " + c.refBy.join(" ")).toLowerCase(), hash: `#${site}/datamodel` }));
  }
  d.findings.forEach(f => SIDX.push({ site, kind: "finding", title: f.area, sub: f.finding,
    text: (f.area + " " + f.finding + " " + f.action).toLowerCase(), hash: `#${site}/findings` }));
});
const pal = document.getElementById("pal"), palq = document.getElementById("palq"), pall = document.getElementById("pall");
let palRes = [], palSel = 0;
function palSearch(term){
  const t = term.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!t.length) return SIDX.filter(x => x.kind === "module").slice(0, 30);
  const out = [];
  SIDX.forEach(x => {
    if (!t.every(w => x.text.includes(w))) return;
    const ti = x.title.toLowerCase();
    let sc = x.kind === "module" ? 30 : x.kind === "finding" ? 5 : 10;
    t.forEach(w => { if (ti === w) sc += 40; else if (ti.includes(w)) sc += 20; if (ti.startsWith(w)) sc += 5; });
    if (x.site === SITE) sc += 3;
    out.push([sc, x]);
  });
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, 40).map(a => a[1]);
}
function palPaint(){
  palRes = palSearch(palq.value); palSel = 0;
  pall.innerHTML = palRes.map((x, i) => `<li data-i="${i}" class="${i === 0 ? "sel" : ""}">
    <span class="tag" style="margin:0">${x.site === "backend" ? "Backend" : "Corporate"}</span>
    ${x.method ? `<span class="pill ${esc(x.method)}">${esc(x.method)}</span>` : `<span class="tag" style="margin:0">${x.kind}</span>`}
    <span class="t">${esc(x.title)}<span class="s">${esc(String(x.sub || "").slice(0, 140))}</span></span></li>`).join("") || `<li class="muted">No results.</li>`;
}
function palMove(d){
  if (!palRes.length) return;
  palSel = (palSel + d + palRes.length) % palRes.length;
  pall.querySelectorAll("li").forEach((li, i) => li.classList.toggle("sel", i === palSel));
  const el = pall.children[palSel]; if (el) el.scrollIntoView({ block: "nearest" });
}
function palGo(i){
  const x = palRes[i]; if (!x) return;
  palClose();
  if (location.hash === x.hash) show(x.hash.slice(1)); else location.hash = x.hash;
}
function palOpen(){ pal.classList.add("open"); palq.value = ""; palPaint(); palq.focus(); }
function palClose(){ pal.classList.remove("open"); }
palq.addEventListener("input", palPaint);
palq.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); palGo(palSel); }
  else if (e.key === "Escape") palClose();
});
pall.addEventListener("click", e => { const li = e.target.closest("li[data-i]"); if (li) palGo(+li.dataset.i); });
pal.addEventListener("click", e => { if (e.target === pal) palClose(); });
document.getElementById("searchBtn").addEventListener("click", palOpen);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.classList.contains("open") ? palClose() : palOpen(); }
  else if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); palOpen(); }
  else if (e.key === "Escape") palClose();
});
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { location.hash = `#${b.dataset.site}/overview`; }));

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("nav").classList.toggle("open"));
setSite("backend");
show(location.hash.slice(1));
</script>
